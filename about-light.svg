<desc id="desc">Hi, I&#39;m Diego I&#39;m a Computer Systems Engineer passionate about building scalable software, designing backend systems, and exploring cloud infrastructure. I enjoy experimenting with homelab environments, building self-hosted services, exploring networking technologies, and working on personal projects that challenge me to learn something new.</desc>
